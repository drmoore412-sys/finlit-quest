<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0e1f">
<title>Where Should My Money Go? | FinLit Quest</title>
<link rel="icon" href="assets/brand/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/brand/icons/apple-touch-icon-180.png">
<style>
.fq-topnote{position:relative;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:8px max(14px,env(safe-area-inset-left));background:#0b0e1fee;border-bottom:1px solid #ffffff22;color:#e9ecff;font:600 13px/1.3 "Albert Sans",system-ui,sans-serif}
.fq-topnote{padding-right:116px}
.fq-topnote a{color:#ffd45e;text-decoration:none;font-weight:700;padding:6px 2px}
.fq-topnote a:focus-visible{outline:2px solid #ffd45e;outline-offset:2px}
.fq-topnote span{opacity:.9}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap">
<style>
/* Layout concept: a night-time fantasy city map as the hub; every screen is a translucent panel floating over the scenery. Dark by choice (arcade-at-night world). */
:root{
  --ink:#0b0e1f; --ink-2:#121735; --panel:rgba(20,26,58,.78); --panel-solid:#161c3d;
  --line:rgba(233,185,73,.26); --line-soft:rgba(160,170,230,.18);
  --gold:#e9b949; --gold-soft:#f6dca0; --teal:#47d1c4; --violet:#8b7cf6;
  --text:#eef0fa; --muted:#a9aecb; --good:#52d6a0; --learn:#f2b45a;
  --font-display:"Cinzel","Palatino Linotype",Georgia,serif;
  --font-body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{
  margin:0; background:var(--ink); color:var(--text); font:16px/1.55 var(--font-body);
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(1200px 600px at 50% -10%,#232a63 0%,transparent 60%),radial-gradient(800px 500px at 90% 30%,#2a1f5a55 0%,transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.9rem,5vw,3rem)} h2{font-size:clamp(1.35rem,3.4vw,1.9rem)} h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin-inline:auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--font-display);color:var(--gold);letter-spacing:.08em;font-size:.95rem;text-transform:uppercase}
.brand span{color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line-soft);border-radius:999px;background:rgba(10,14,36,.55);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--text);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero{display:grid;gap:14px}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.lede{color:var(--muted);max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:11px 18px;border-radius:10px;font-weight:600;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#f3cc66,#d9a232);color:#1c1405;border-color:#f6dca0}
.btn.primary:hover{background:linear-gradient(180deg,#f8d77f,#e2ac3a)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent}
.link{background:none;border:0;color:var(--gold-soft);text-decoration:underline;text-underline-offset:3px;padding:2px;cursor:pointer}
.map-card{padding:0;overflow:hidden}
.map{display:block;width:100%;height:auto}
.node{cursor:pointer;outline:none}
.node .ring{fill:var(--c);fill-opacity:.14;stroke:var(--c);stroke-width:2;transition:fill-opacity .15s}
.node:hover .ring,.node:focus-visible .ring{fill-opacity:.32}
.node .focus{fill:none;stroke:none}
.node:focus-visible .focus{stroke:var(--gold);stroke-width:3}
.node .ico{color:var(--c)}
.node text{fill:var(--text);font:600 15px var(--font-body);text-anchor:middle;paint-order:stroke;stroke:#0b0e1f;stroke-width:4px}
.node .done{fill:var(--good);}
.road{fill:none;stroke:rgba(233,185,73,.5);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 9}
.glow{filter:drop-shadow(0 0 8px var(--c))}
@media (prefers-reduced-motion:no-preference){
  .road{animation:flow 6s linear infinite}
  .pulse{animation:pulse 3.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .star{animation:tw 4s ease-in-out infinite}
}
@keyframes flow{to{stroke-dashoffset:-110}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.12)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.list-map{display:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dcard{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.04)}
.dcard:hover{border-color:var(--c);background:rgba(255,255,255,.08)}
.dcard .ico{color:var(--c);flex:none}
.dcard small{display:block;color:var(--muted);line-height:1.3}
.dcard b{display:block}
@media (max-width:700px){.list-map{display:block}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.two>*{min-width:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;border:1px solid var(--line-soft);color:var(--muted)}
.tag.gold{border-color:var(--line);color:var(--gold-soft)}
ul.clean{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.clean li{padding-left:18px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--c,var(--gold));transform:rotate(45deg)}
dl.vocab{margin:0;display:grid;gap:10px}
dl.vocab dt{font-weight:700;color:var(--gold-soft)}
dl.vocab dd{margin:0;color:var(--text)}
.badge{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--c,var(--line));background:rgba(255,255,255,.04)}
.pips{display:flex;gap:8px}
.pip{width:34px;height:8px;border-radius:99px;background:rgba(255,255,255,.14)}
.pip.on{background:var(--gold)} .pip.good{background:var(--good)} .pip.learn{background:var(--learn)}
.scn-title{display:grid;gap:6px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line-soft);background:rgba(255,255,255,.04);transition:border-color .12s,background .12s}
.opt .ico{color:var(--c);flex:none}
.opt:hover:not([disabled]){border-color:var(--c);background:rgba(255,255,255,.08)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:rgba(233,185,73,.12)}
.opt .k{margin-left:auto;color:var(--muted);font-size:.8rem;border:1px solid var(--line-soft);border-radius:6px;padding:1px 7px}
.opt.best{border-color:var(--good);background:rgba(82,214,160,.1)}
.opt.picked-wrong{border-color:var(--learn);background:rgba(242,180,90,.1)}
.opt[disabled]{cursor:default}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verdict .pts{font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.good-t{color:var(--good)} .learn-t{color:var(--learn)}
.box{border-left:3px solid var(--gold);padding:8px 14px;background:rgba(255,255,255,.04);border-radius:0 8px 8px 0}
.others{display:grid;gap:8px}
.others div{padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;background:rgba(255,255,255,.03)}
details>summary{cursor:pointer;color:var(--gold-soft);font-weight:600}
.score{font-family:var(--font-display);font-size:clamp(2.6rem,9vw,4.4rem);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.foot{border-top:1px solid var(--line-soft);padding-top:14px;color:var(--muted);font-size:.82rem;display:grid;gap:6px}
.lock{opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1c1405}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.pcard{text-align:left;display:grid;gap:10px;align-content:start;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.pcard:hover{border-color:var(--gold);background:rgba(30,38,80,.85)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv>div{padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;background:rgba(255,255,255,.03);min-width:0}
.kv small{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
.kv b{font-variant-numeric:tabular-nums}
.wallet{display:grid;gap:14px}
.big{font-family:var(--font-display);font-size:clamp(2rem,7vw,3.2rem);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.big.ok{color:var(--good)}
.stack{display:flex;height:24px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.1)}
.stack i{display:block;height:100%;transition:width .45s;min-width:0}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.arow{display:grid;gap:10px;padding:14px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.03)}
.arow-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.arow .ico{color:var(--c);flex:none}
.arow-ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.amt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:rgba(0,0,0,.28)}
.amt input{width:84px;background:transparent;border:0;color:var(--text);font:inherit;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--c,var(--gold));min-height:28px}
.xbox{display:grid;gap:8px;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.25)}
.runbar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:rgba(11,14,31,.95);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chart{display:block;width:100%;height:auto}
.evcard{border-left:4px solid var(--c,var(--teal));display:grid;gap:10px}
.evcard p{max-width:70ch}
[hidden]{display:none!important}
.meter{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width 1s ease}
details.cat{border:1px solid var(--line-soft);border-radius:12px;padding:14px;background:rgba(255,255,255,.03)}
details.cat summary{list-style:none}
details.cat summary::-webkit-details-marker{display:none}
.cat-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pts{font-variant-numeric:tabular-nums;font-weight:700}
.chk{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.2);display:grid;gap:4px}
.chk-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
table.cmp{min-width:680px}
table.cmp th[scope=row]{text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--gold-soft);width:18%}
table.cmp td{width:27%}
/* ===== Phase 4: Financial City scene, HUD, event cinematics, audio controls, celebration ===== */
.audiobar{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:50;display:flex;gap:8px}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(12,16,44,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--gold-soft);padding:0}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn[aria-pressed="false"]{color:var(--muted)}
.iconbtn svg{width:22px;height:22px}
.iconbtn .off{display:none}.iconbtn[aria-pressed="false"] .on{display:none}.iconbtn[aria-pressed="false"] .off{display:block}
.top{padding-right:112px}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#070a22;aspect-ratio:1000/620;max-height:64vh;width:100%;isolation:isolate}
.stage.home{max-height:none}
.stage .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(12,16,44,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 12px;color:var(--text)}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;pointer-events:none;z-index:3}
.hud .glass{font-variant-numeric:tabular-nums;display:grid;line-height:1.15}
.hud small{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud b{font-family:var(--font-display);font-size:1.15rem;color:var(--gold-soft)}
.hud b.ok{color:var(--good)}
.stagehint{position:absolute;left:10px;bottom:10px;z-index:3;font-size:.8rem;color:var(--text);pointer-events:none}
.alloc-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.alloc-grid>*{min-width:0}
.stagecol{position:sticky;top:0;z-index:6;padding-top:8px;background:linear-gradient(var(--ink) 70%,transparent)}
@media (min-width:900px){
  .alloc-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .stagecol{top:12px;padding-top:0;background:none}
  .stagecol .stage{max-height:none}
}
@media (max-width:899px){
  .stagecol .stage,.stage.sticky{aspect-ratio:1000/560}
  .stage.sticky{max-height:none}
}
.simstage{position:sticky;top:0;z-index:6;padding-top:8px;background:linear-gradient(var(--ink) 80%,transparent)}
@media (min-width:900px){.simstage .stage{max-height:min(46vh,430px)}.simstage{padding-top:6px}}

/* scene */
.sk1{opacity:.9}.sk2{opacity:1}
.road{fill:none;stroke:url(#gRoad);stroke-width:3;stroke-linecap:round;stroke-dasharray:3 10;opacity:.85;filter:drop-shadow(0 0 4px #ffb86b)}
.bld{cursor:pointer;outline:none}
.bld .bfloat{transition:transform .25s ease}
.bld:hover .bfloat,.bld:focus-visible .bfloat{transform:translateY(-6px)}
.bld .bring{stroke:none;transition:stroke .15s}
.bld:focus-visible .bring{stroke:var(--gold);stroke-width:4}
.blight{opacity:.16;transition:opacity .4s}
.bld:hover .blight,.bld:focus-visible .blight,.bld.funded .blight{opacity:.5}
.ln rect,.la rect{fill:rgba(10,14,40,.62);stroke:var(--c);stroke-opacity:.6}
.lname{fill:#fff;font:700 19px var(--font-body);paint-order:stroke;stroke:#0b0e1f;stroke-width:3px}
.lamt{fill:var(--gold-soft);font:700 19px var(--font-body);font-variant-numeric:tabular-nums}
.la rect{stroke:var(--gold);stroke-opacity:.5}
.bld.funded .la rect{fill:rgba(60,45,5,.75);stroke-opacity:1}
.enter{opacity:0;transition:opacity .2s;pointer-events:none}
.enter text{fill:var(--gold);font:700 24px var(--font-display);paint-order:stroke;stroke:#0b0e1f;stroke-width:5px}
.bld:hover .enter,.bld:focus-visible .enter{opacity:1}
.bld.pulse .blight{animation:blpulse .8s ease-out}
@keyframes blpulse{0%{opacity:.95}100%{opacity:.5}}
@media (max-width:700px){
  .ln{display:none}
  .la{transform:translateY(-34px)}
  .lamt{font-size:26px}
  .la rect{x:-60px;width:120px;height:34px}
  .la text{transform:translateY(5px)}
}
.stage.home .la{display:none}

@media (prefers-reduced-motion:no-preference){
  .star{animation:tw 4s ease-in-out infinite}
  .tw{animation:tw 5s ease-in-out infinite}
  .aurora{animation:drift 14s ease-in-out infinite alternate}.aurora.a2{animation-duration:19s}
  .sk1{animation:skyd 40s ease-in-out infinite alternate}
  .road{animation:flow 5s linear infinite}
  .jet{stroke-dasharray:60;animation:jet 1.8s ease-in-out infinite}.jet.d2{animation-delay:.4s}.jet.d3{animation-delay:.8s}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
  .tfill{transform-box:fill-box;transform-origin:50% 100%;animation:fill 4s ease-in-out infinite alternate}
  .cfall{animation:cfall 3.2s linear infinite}.cfall.d2{animation-delay:1s}.cfall.d3{animation-delay:2s}
  .tbar{transform-box:fill-box;transform-origin:50% 100%;animation:bars 2.4s ease-in-out infinite alternate}
  .tline{stroke-dasharray:240;animation:tdraw 5s ease-in-out infinite alternate}
  .beacon{animation:blink 1.6s steps(2,jump-none) infinite}
  .holo{animation:hfloat 4s ease-in-out infinite}
  .hspin{transform-box:fill-box;transform-origin:50% 50%;animation:hspin 5s linear infinite}
  .ringp{animation:flow 6s linear infinite}
  .beam{animation:blink2 3s ease-in-out infinite}
  .dnode,.fnode{animation:blink2 2s ease-in-out infinite}.fnode.d2{animation-delay:.8s}
  .dlines{animation:flow 3s linear infinite}
  .hand{transform-box:view-box;transform-origin:0 -86px;animation:hand 12s linear infinite}
  .lamp,.win{animation:blink2 3.5s ease-in-out infinite}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:flagw 2.6s ease-in-out infinite}
  .cert{animation:cert 6s ease-in-out infinite}
  .vault{animation:blink2 3s ease-in-out infinite}
}
@keyframes flow{to{stroke-dashoffset:-130}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes skyd{from{transform:translateX(0)}to{transform:translateX(-14px)}}
@keyframes jet{0%{stroke-dashoffset:60;opacity:.3}50%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-60;opacity:.3}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes fill{from{transform:scaleY(.88)}to{transform:scaleY(1)}}
@keyframes cfall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(100px);opacity:0}}
@keyframes bars{from{transform:scaleY(.5)}to{transform:scaleY(1.7)}}
@keyframes tdraw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes blink2{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes hfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes hspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes hand{to{transform:rotate(360deg)}}
@keyframes flagw{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes cert{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}

/* reason chooser */
.reason{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reason label{font-size:.85rem;color:var(--muted)}
.reason select{background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-height:40px;max-width:100%}
.reason select.empty{border-color:var(--learn)}
.arow.hot{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

/* event cinematics. Overlays are decorative, never sit on the HUD, and the exact numbers also appear in the event card below. */
.fxlayer{position:absolute;inset:0;pointer-events:none;z-index:2}
.fxlayer>*{position:absolute}
.fx-tag{left:10px;bottom:10px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:rgba(12,16,44,.7);border:1px solid rgba(255,255,255,.25);color:var(--text)}
.fx-banner{left:50%;top:62px;transform:translateX(-50%);font:700 clamp(.8rem,2.4vw,1.15rem) var(--font-display);padding:6px 14px;border-radius:99px;white-space:nowrap;background:rgba(12,16,44,.78);border:1.5px solid;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.fx-banner.bad{color:#ff8a96;border-color:#ff6a7a}.fx-banner.warn{color:#ffd27a;border-color:#ffb02e}.fx-banner.good{color:#7ff0b8;border-color:#52d6a0}.fx-banner.glitch{color:#c4b5fd;border-color:#a78bfa}
.fx-red{inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 35%,rgba(255,40,70,.45) 100%);mix-blend-mode:screen}
.fx-amber{inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 35%,rgba(255,170,30,.4) 100%)}
.fx-green{inset:0;background:radial-gradient(ellipse at 50% 70%,rgba(110,255,190,.22),transparent 65%)}
.fx-graph{right:3%;top:64px;width:30%;max-width:240px;filter:drop-shadow(0 0 6px rgba(255,106,122,.6));opacity:.95}
.fx-notify{left:50%;top:112px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:12px;background:rgba(40,12,8,.78);border:1.5px solid #ffb02e;color:#fff;max-width:86%}
.fx-notify b{display:block;color:#ffd27a;font-size:.8rem;letter-spacing:.1em}.fx-notify span{font-size:.85rem}
.siren{width:16px;height:16px;border-radius:50%;background:#ff5c6a;box-shadow:0 0 14px #ff5c6a;flex:none}
.fx-gauges{left:50%;top:112px;transform:translateX(-50%);display:grid;gap:8px;width:min(76%,380px);background:rgba(12,16,44,.7);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 14px}
.gauge{display:grid;gap:4px;font-size:.78rem}.gauge b{font-variant-numeric:tabular-nums;color:var(--gold-soft)}
.gbar{height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.gfill{display:block;height:100%;width:var(--to);background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px}
.fx-bill{left:50%;top:104px;transform:translateX(-50%)}
.slip{position:relative;display:grid;gap:2px;text-align:center;padding:10px 20px 12px;background:#fff7dc;color:#241a05;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45);min-width:150px}
.slip small{letter-spacing:.2em;font-size:.65rem}.slip b{font-size:.9rem}.slip span{font:700 1.2rem var(--font-display)}
.stamp{position:absolute;right:-12px;bottom:-8px;font:700 1.1rem var(--font-display);color:#1f9d6a;border:3px solid #1f9d6a;border-radius:6px;padding:0 8px;transform:rotate(-12deg);background:rgba(255,247,220,.9);font-style:normal}
.fx-peg{left:50%;top:100px;transform:translateX(-50%);width:130px;height:110px}
.pegline{position:absolute;left:-30px;right:-30px;top:20px;border-top:2px dashed #7fe6ff;color:#7fe6ff;font-size:.7rem}.pegline span{position:absolute;right:0;top:-18px}
.pegcoin{position:absolute;left:33px;top:6px;width:64px;height:64px;border-radius:50%;border:3px solid #f6dc8a;background:rgba(79,208,232,.2);display:grid;place-items:center;box-shadow:0 0 18px #7fe6ff;color:#f6dc8a}
.pegcoin b{font:700 1.6rem var(--font-display)}.pegcoin small{position:absolute;bottom:-22px;font-weight:700;color:#ff8a96}
.fx-beacon{inset:0;box-shadow:inset 0 0 60px 8px rgba(255,60,80,.45)}
.fx-glitch{inset:0;background:repeating-linear-gradient(0deg,rgba(167,139,250,.0) 0 3px,rgba(167,139,250,.22) 3px 4px);mix-blend-mode:screen}
.fx-power{left:50%;top:112px;transform:translateX(-50%);display:grid;gap:6px;width:min(78%,400px);background:rgba(12,16,44,.7);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 14px;font-size:.82rem}
.fx-power b{color:var(--gold-soft);font-weight:600}
.fx-arrows{left:0;right:0;bottom:0;top:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 10%}
.fx-arrows i{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid #7ff0b8;opacity:.9;filter:drop-shadow(0 0 6px #7ff0b8)}

@media (prefers-reduced-motion:no-preference){
  .fx-red,.fx-amber,.fx-green,.fx-beacon{animation:fxin .6s ease-out both}
  .fx-beacon{animation:fxin .6s ease-out both,blink2 1s ease-in-out .6s infinite}
  .fx-banner{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .fx-notify,.fx-bill,.fx-gauges,.fx-power,.fx-peg{animation:drop .6s cubic-bezier(.2,1.2,.4,1) both}
  .fx-graph .draw{stroke-dasharray:420;animation:gdraw 1.6s ease-out both}
  .fx-graph .drawfill{animation:fxin 1.6s ease-out both}
  .siren{animation:blink .6s steps(2,jump-none) infinite}
  .gfill{animation:gfill 1.6s ease-out .3s both}
  .stamp{animation:stampin .4s cubic-bezier(.2,1.6,.4,1) 1.4s both}
  .pegcoin{animation:pegdrop 1.8s ease-in .2s both}
  .fx-glitch{animation:glitch .35s steps(3) infinite}
  .e-defi .b-defi{animation:flick .5s steps(2,jump-none) 6}
  .fx-arrows i{animation:rise 1.6s ease-out infinite}.fx-arrows i:nth-child(2){animation-delay:.2s}.fx-arrows i:nth-child(3){animation-delay:.4s}.fx-arrows i:nth-child(4){animation-delay:.6s}.fx-arrows i:nth-child(5){animation-delay:.8s}
  .e-market .b-stocks .tline{animation:none}
}
@keyframes fxin{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes drop{from{opacity:0;margin-top:-26px}to{opacity:1;margin-top:0}}
@keyframes gdraw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes gfill{from{width:var(--from)}to{width:var(--to)}}
@keyframes stampin{from{opacity:0;transform:rotate(-12deg) scale(2.4)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes pegdrop{0%{transform:translateY(0)}100%{transform:translateY(26px)}}
@keyframes glitch{0%{transform:translateX(0)}33%{transform:translateX(5px)}66%{transform:translateX(-4px)}100%{transform:translateX(0)}}
@keyframes flick{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
@keyframes rise{0%{transform:translateY(24px);opacity:0}30%{opacity:.9}100%{transform:translateY(-90px);opacity:0}}
/* per-building event effects */
.e-market .b-stocks .screen{fill:#3a0a14;stroke:#ff6a7a}.e-market .b-stocks .tline{stroke:#ff6a7a}.e-market .b-stocks .tbar{fill:#ff6a7a}.e-market .b-stocks .blight{fill:#ff3a56;opacity:.6}
.e-defi .b-defi .dlines{stroke:#ff6a7a}.e-defi .b-defi .blight{fill:#ff3a56;opacity:.6}
.e-depeg .b-stable .blight{fill:#ff3a56;opacity:.6}.e-depeg .b-stable .holo circle:first-child{stroke:#ff8a96}
.e-growth .b-stocks .tline{stroke:#5fe3a1}.e-growth .b-stocks .blight,.e-growth .b-hysa .blight{fill:#5fe3a1;opacity:.6}.e-growth .scene{filter:brightness(1.14) saturate(1.1)}
.e-rates .b-hysa .tfill,.e-rates .b-credit .win{opacity:.45}
.e-inflation .scene{filter:saturate(.65)}
.e-emergency .scene{filter:saturate(.9)}
.fxcoin{pointer-events:none}

/* results celebration */
.celebrate{position:relative;overflow:hidden;text-align:center;display:grid;gap:12px;justify-items:center;padding-block:34px}
.celebrate .burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.celebrate .burst i{position:absolute;left:50%;top:44%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#e2b24a 60%,#9a6a14);box-shadow:0 0 10px rgba(246,220,138,.7)}
.celebrate .rays{position:absolute;left:50%;top:44%;width:560px;height:560px;margin:-280px 0 0 -280px;background:repeating-conic-gradient(from 0deg,rgba(246,220,138,.16) 0 8deg,transparent 8deg 20deg);border-radius:50%;pointer-events:none;mask-image:radial-gradient(circle,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 70%);opacity:0}
.celebrate>*:not(.burst):not(.rays){position:relative}
.rating-stamp{font:700 clamp(1.6rem,6vw,2.6rem) var(--font-display);color:#ffe9a8;text-shadow:0 0 22px rgba(246,220,138,.6);border:3px double var(--gold);padding:6px 22px;border-radius:10px;background:rgba(40,28,4,.45)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%;max-width:640px}
.kpis>div{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05)}
.kpis small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.kpis b{font:700 1.3rem var(--font-display);font-variant-numeric:tabular-nums;color:var(--gold-soft)}
.practice-note{max-width:60ch;font-size:.85rem;color:var(--muted);border:1px dashed var(--line-soft);border-radius:10px;padding:8px 12px}
@media (prefers-reduced-motion:no-preference){
  .celebrate .rays{animation:raysin 1.2s ease-out .1s forwards,spin 40s linear infinite}
  .celebrate .burst i{animation:coinburst var(--d,1.6s) cubic-bezier(.15,.7,.3,1) var(--dl,0s) both}
  .rating-stamp{animation:stampin2 .6s cubic-bezier(.2,1.6,.4,1) .9s both}
  .kpis>div{animation:fxin .5s ease-out both}.kpis>div:nth-child(2){animation-delay:.15s}.kpis>div:nth-child(3){animation-delay:.3s}.kpis>div:nth-child(4){animation-delay:.45s}
}
@keyframes raysin{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes coinburst{0%{transform:translate(0,0) scale(.3);opacity:0}12%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
@keyframes stampin2{from{opacity:0;transform:scale(2.2) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.celebrate .rays{opacity:.9}
@media (prefers-reduced-motion:no-preference){.celebrate .rays{opacity:0}}
.audio-note{font-size:.8rem;color:var(--muted)}

.hud{padding-right:104px}
@media (max-width:700px){.iconbtn{width:40px;height:40px}.audiobar{gap:6px}.hud{padding-right:92px}.hud b{font-size:1rem}.hud .glass{padding:4px 10px}}

.hud .glass.evon{border-color:#ffd27a;background:rgba(60,40,6,.6)}.hud .glass.evon small{color:#ffd27a}
@media (min-width:900px){.simstage .stage{width:min(100%,calc(min(52vh,520px)*1.613));max-height:min(52vh,520px);margin-inline:auto}}
@media (max-width:700px){.fx-banner{top:50px}.fx-graph{top:52px;width:36%}.fx-notify{top:92px}.fx-gauges,.fx-power{top:92px}.fx-bill{top:88px}.fx-peg{top:84px}}

.hud{flex-wrap:nowrap}.hud .glass{min-width:0;white-space:nowrap}
@media (max-width:899px){.simstage .stage{aspect-ratio:1000/640}}

@media (max-width:700px){.top{padding-right:100px}.stats{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px;gap:6px}.stats .chip{white-space:nowrap;flex:none}.top{flex-direction:column;align-items:flex-start}.hud small{font-size:.6rem}}

@media (max-width:700px){.slip{padding:6px 12px 8px;min-width:120px;max-width:200px}.slip b{font-size:.74rem}.slip span{font-size:1rem}.stamp{font-size:.8rem}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.celebrate .burst{display:none}}

.coinfx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.coinfx i,.celebrate .burst i{display:grid;place-items:center;font:700 .8rem/1 var(--font-display);color:#7a5210;font-style:normal}
.coinfx i{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#e2b24a 60%,#9a6a14);box-shadow:0 0 10px rgba(246,220,138,.7),inset 0 0 0 2px rgba(154,106,20,.6)}
.celebrate .burst i{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.coinfx{display:none}}

  PROFILES.sort(function(a,b){ return a.age-b.age; });

  /* ---- Knowledge questions (20 points each, asked after the matching event) ---- */
  function questions(A){
    return {
      market:{ id:"market", prompt:"The market fell "+pct(A.marketDecline.drop)+". Which statement is most accurate?", correct:1,
        options:["Diversified funds cannot lose money, so this must be an error.","A drop is a paper loss until you sell. Money needed soon is at risk, while money needed decades from now has time to recover, though recovery is never guaranteed.","You should immediately move everything into whichever asset rose the most."],
        explain:"Prices rise and fall. The danger comes from needing the money during a drop. That is why timing and purpose matter." },
      rates:{ id:"rates", prompt:"Your high-yield savings APY changed from "+pct(A.apy.hysa,1)+" to "+pct(A.apy.hysa+A.rateChange.hysa,1)+". What does this show?", correct:0,
        options:["APY on savings accounts is variable, so it can rise or fall over time.","Only credit unions are allowed to change their rates.","The bank made an error, because APY is fixed for the life of an account."],
        explain:"Savings APY is usually variable. A Treasury security held to maturity locks its rate for the term instead." },
      depeg:{ id:"depeg", prompt:"A stablecoin that aims for $1 trades at $"+A.depeg.price.toFixed(2)+". Which statement is accurate?", correct:2,
        options:["FDIC insurance covers the difference.","A depeg is always permanent.","The peg is a goal, not a guarantee, and a stablecoin is not covered by deposit insurance."],
        explain:"Fiat-backed coins depend on their reserves and redemption rules, and other designs add more risk. Coins have lost their peg before." },
      defi:{ id:"defi", prompt:"A DeFi protocol advertising a "+pct(A.apy.defi)+" yield freezes withdrawals after a security incident. Which lesson fits best?", correct:1,
        options:["The government insures DeFi balances up to $250,000.","Smart-contract and liquidity risks are real, and an advertised yield is not a guaranteed return.","This could only have happened because of inflation."],
        explain:"DeFi has no deposit insurance, and mistakes or hacks are usually final. A very high advertised yield is a clue to look harder at risk." },
      infl:{ id:"infl", prompt:"Prices rose "+pct(A.inflation.y1,1)+" this year. An account earned "+pct(A.apy.hysa+A.rateChange.hysa,1)+". What happened to purchasing power?", correct:2,
        options:["It grew, because the balance went up.","It stayed the same, because a dollar is a dollar.","It shrank slightly: the balance grew, but prices rose faster."],
        explain:"Nominal balance and purchasing power are different. Earning less than inflation means each dollar buys less over time." }
    };
  }

  /* ---- Simulation ---- */
  function simulate(prof, alloc, A){
    A = A || ASSUMP;
    var st = { v:{}, units:alloc.stable||0, price:1, debt:0, market:1, failed:false, apy:{}, pl:1, earned:0, paper:0, debtCost:0, spent:0 };
    ORDER.forEach(function(k){ st.v[k] = alloc[k]||0; st.apy[k] = A.apy[k]||0; });
    function sv(k){ return k==="stable" ? st.units*st.price : st.v[k]; }
    function nw(){ var t=0; ORDER.forEach(function(k){ t+=sv(k); }); return t - st.debt; }
    function vals(){ var o={}; ORDER.forEach(function(k){ o[k]=sv(k); }); return o; }
    function avail(k){ return (k==="defi" && st.failed) ? 0 : sv(k); }
    function take(k, amt){ if (k==="stable") st.units -= amt/st.price; else st.v[k] -= amt; }
    function pay(amount){
      var rem = amount, used = [], w = 0; st.spent += amount;
      PAY.forEach(function(k){
        if (rem <= 0.005) return;
        var a = avail(k); if (a <= 0.005) return;
        var f = k==="treasury" ? 1-A.treasuryHaircut : k==="retire" ? 1-(prof.retireAccess!=null?prof.retireAccess:A.retireEarlyAccess) : 1;
        var gross = Math.min(a, rem/f), proc = gross*f; take(k, gross); rem -= proc;
        var note = "";
        if (k==="stocks" && st.market<1) note = "sold while the market was down "+pct(1-st.market)+", locking in a "+usd(gross/st.market-gross)+" loss versus the starting value";
        if (k==="retire") note = "withdrawal cost "+usd(gross-proc)+" (illustrative placeholder; real costs vary by account type and situation)";
        if (k==="treasury") note = "selling before maturity cost "+usd(gross-proc);
        if (k==="stable" && st.price<1) note = "the coin was below its peg, so you received "+usd(gross)+" for tokens worth "+usd(gross/st.price)+" at $1";
        if (k==="defi") note = "pulled from a risky protocol as a last resort";
        used.push({ src:k, value:gross, proceeds:proc, note:note });
        w += proc * A.access[k];
      });
      var short = rem > 0.005 ? rem : 0; if (short) st.debt += short;
      return { amount:amount, used:used, shortfall:short, clean: amount>0 ? w/amount : 1 };
    }
    function payText(label, res){
      var parts = res.used.map(function(u){ return LABEL[u.src]+" "+usd(u.proceeds)+(u.note?" ("+u.note+")":""); });
      var out = [label+": "+usd(res.amount)+" came due."];
      out.push(parts.length ? "Paid from: "+parts.join("; ")+"." : "You had nothing available to pay it.");
      var onlyCash = res.used.every(function(u){ return G.cash.indexOf(u.src)>=0; }) && !res.shortfall;
      if (onlyCash) out.push("Covered entirely from insured cash. No investments were sold and nothing was borrowed.");
      else if (res.shortfall) out.push("Short by "+usd(res.shortfall)+". It went on a credit card at "+pct(A.debtApr)+" APR in this simulation, and the interest keeps adding up until the end.");
      else out.push("Covered, but not from insured cash alone. Check the notes above for what it cost.");
      return out;
    }

    var snaps = [{ m:0, v:vals(), debt:0, nw:nw(), pl:1 }], events = [], payments = {};
    var defs = [
      { m:A.rateChange.month, t:"rates", o:0 }, { m:A.marketDecline.month, t:"market", o:1 }, { m:A.emergencyMonth, t:"emergency", o:2 },
      { m:prof.planned.month, t:"planned", o:3 }, { m:A.depeg.month, t:"depeg", o:4 }, { m:A.defiFailure.month, t:"defi", o:5 },
      { m:A.inflation.month, t:"inflation", o:6 }, { m:A.growth.month, t:"growth", o:7 }, { m:A.months, t:"final", o:9 }
    ].sort(function(a,b){ return a.m-b.m || a.o-b.o; });

    for (var m=1; m<=A.months; m++){
      ["bank","credit","hysa","treasury"].forEach(function(k){ var d=st.v[k]*st.apy[k]/12; st.v[k]+=d; st.earned+=d; });
      var ds = st.units*st.price*st.apy.stable/12; st.units *= 1+st.apy.stable/12; st.paper += ds;
      if (!st.failed){ var dd = st.v.defi*st.apy.defi/12; st.v.defi += dd; st.paper += dd; }
      var di = st.debt*A.debtApr/12; st.debt += di; st.debtCost += di;
      if (m===A.depeg.recoverMonth) st.price = A.depeg.recovered;
      defs.filter(function(d){ return d.m===m; }).forEach(function(d){
        var before = nw(), ev = { m:m, type:d.t, title:"", tone:"neutral", body:[], q:null };
        if (d.t==="market"){
          var s0=sv("stocks"), r0=sv("retire");
          st.v.stocks *= 1-A.marketDecline.drop; st.v.retire *= 1-A.marketDecline.drop; st.market *= 1-A.marketDecline.drop;
          ev.title = "Stock market decline"; ev.tone="bad"; ev.q="market";
          if (s0+r0>0){
            ev.body.push("Stocks fell "+pct(A.marketDecline.drop)+". This is a fictional educational example, not a forecast.");
            if (s0>0) ev.body.push("Stocks & ETFs: "+usd(s0)+" to "+usd(sv("stocks"))+".");
            if (r0>0) ev.body.push("Retirement account (invested in the same diversified fund): "+usd(r0)+" to "+usd(sv("retire"))+".");
            ev.body.push("These are paper losses until you sell. Whether this hurts depends on when you need the money.");
          } else ev.body.push("Stocks fell "+pct(A.marketDecline.drop)+", but you held no market investments, so your balance did not move. You also gave up any growth they might have offered.");
        }
        if (d.t==="emergency"){
          var res = pay(prof.emergency.amount); payments.emergency = res;
          ev.title = "Emergency expense: "+prof.emergency.label; ev.tone = res.clean>=0.99?"good":"bad";
          ev.body = payText(prof.emergency.label, res);
        }
        if (d.t==="rates"){
          var h0=st.apy.hysa, c0=st.apy.credit;
          st.apy.hysa += A.rateChange.hysa; st.apy.credit += A.rateChange.credit;
          ev.title = "Interest rates change"; ev.tone="neutral"; ev.q="rates";
          ev.body.push("Savings rates were cut. High-yield savings APY: "+pct(h0,1)+" to "+pct(st.apy.hysa,1)+". Credit union savings: "+pct(c0,1)+" to "+pct(st.apy.credit,1)+". Treasury securities bought earlier keep their rate until maturity.");
          var hs=sv("hysa")+sv("credit"), lost=sv("hysa")*(h0-st.apy.hysa)+sv("credit")*(c0-st.apy.credit);
          ev.body.push(hs>0 ? "On your "+usd(hs)+" in variable-rate savings, that is roughly "+usd(lost)+" less interest per year." : "You held no variable-rate savings, so this did not affect you directly.");
        }
        if (d.t==="planned"){
          var res2 = pay(prof.planned.amount); payments.planned = res2;
          ev.title = "Planned expense: "+prof.planned.label; ev.tone = res2.clean>=0.99?"good":"bad";
          ev.body = payText(prof.planned.label, res2);
        }
        if (d.t==="depeg"){
          var sb = sv("stable"); st.price = A.depeg.price;
          ev.title = "Stablecoin depeg"; ev.tone="bad"; ev.q="depeg";
          ev.body.push("A fictional stablecoin slipped from $1.00 to $"+A.depeg.price.toFixed(2)+" after doubts about its reserves. This is an educational example, not a prediction.");
          ev.body.push(sb>0 ? "Your stablecoins: "+usd(sb)+" to "+usd(sv("stable"))+". Rumors spread faster than redemptions, and tokens are not covered by deposit insurance. A partial recovery is assumed by month "+A.depeg.recoverMonth+"." : "You held no stablecoins, so you were not exposed.");
        }
        if (d.t==="defi"){
          var db = sv("defi");
          ev.title = "DeFi protocol failure"; ev.tone="bad"; ev.q="defi";
          if (db>0){ st.v.defi *= 1-A.defiFailure.loss; st.failed=true;
            ev.body.push("A fictional lending protocol advertising "+pct(A.apy.defi)+" suffered a security incident. Your DeFi position: "+usd(db)+" to "+usd(sv("defi"))+", and the remaining funds are frozen. There is no deposit insurance and no one to reverse it.");
          } else { st.failed=true; ev.body.push("A fictional DeFi lending protocol advertising "+pct(A.apy.defi)+" suffered a security incident and lost "+pct(A.defiFailure.loss)+" of deposits. You held no DeFi, so you were not exposed."); }
        }
        if (d.t==="inflation"){
          st.pl *= 1+A.inflation.y1;
          ev.title = "Inflation"; ev.tone="neutral"; ev.q="infl";
          ev.body.push("Prices rose "+pct(A.inflation.y1,1)+" this year, so each dollar buys less than before.");
          ev.body.push("Your balance is now "+usd(nw())+" in dollars, which buys about "+usd(nw()/st.pl)+" in starting-year prices.");
        }
        if (d.t==="growth"){
          var gs=sv("stocks")+sv("retire");
          st.v.stocks *= 1+A.growth.gain; st.v.retire *= 1+A.growth.gain; st.market *= 1+A.growth.gain;
          ev.title = "Long-term market growth"; ev.tone="good";
          ev.body.push("After a recovery, the diversified stock fund gained "+pct(A.growth.gain)+" in this simulated stretch. Long-term growth is possible but never guaranteed, and this is not a forecast.");
          ev.body.push(gs>0 ? "Your market holdings: "+usd(gs)+" to "+usd(sv("stocks")+sv("retire"))+"." : "You held no market investments, so you did not take part in the recovery.");
        }
        if (d.t==="final"){
          st.pl *= 1+A.inflation.y2;
          var have=0; (G[prof.final.dests]||[]).forEach(function(k){ have+=avail(k); });
          var met = have >= prof.final.amount - 0.5;
          ev.title = "Two years later"; ev.tone = met?"good":"bad";
          ev.body.push(prof.final.label+": "+usd(prof.final.amount)+" needed, "+usd(have)+" available in "+GNAME[prof.final.dests]+". "+(met?"Goal met.":"Goal missed by "+usd(prof.final.amount-have)+"."));
          ev.body.push("Ending virtual balance: "+usd(nw())+". In starting-year prices that buys about "+usd(nw()/st.pl)+".");
          ev.final = { met:met, have:have, need:prof.final.amount };
        }
        ev.before = before; ev.after = nw(); events.push(ev);
      });
      snaps.push({ m:m, v:vals(), debt:st.debt, nw:nw(), pl:st.pl });
    }
    var fin = events[events.length-1].final;
    return { snaps:snaps, events:events, payments:payments, final:fin,
      end:{ v:vals(), debt:st.debt, nw:nw(), real:nw()/st.pl, pl:st.pl, earned:st.earned, paper:st.paper, debtCost:st.debtCost, spent:st.spent, frozen: st.failed ? sv("defi") : 0 } };
  }

  /* ---- Scoring ---- */
  function dests(where){ return G[where] || [where]; }
  function sumOf(alloc, where){ var t=0; dests(where).forEach(function(k){ t+=alloc[k]||0; }); return t; }
  function creditRange(sum, lo, hi, soft){ lo=lo||0; if (hi==null) hi=Infinity; soft=soft||2000; var dev = sum<lo ? lo-sum : sum>hi ? sum-hi : 0; return dev<=0 ? 1 : Math.max(0, 1-dev/soft); }
  function rangeText(lo, hi){ if (lo>0 && hi!=null && hi<Infinity) return "between "+usd(lo)+" and "+usd(hi); if (lo>0) return "at least "+usd(lo); if (hi!=null && hi<Infinity) return "no more than "+usd(hi); return "any amount"; }
  function item(id,label,max,credit,detail,why){ return { id:id, label:label, max:max, earned:Math.round(max*credit), detail:detail, why:why }; }

  function score(prof, alloc, sim, extra, A){
    A = A || ASSUMP; extra = extra || {};
    var cats = [], L = prof.limits;
    // A. Goal alignment (300)
    var goal = prof.goal.map(function(c){ var s=sumOf(alloc,c.where); var cr=creditRange(s,c.lo,c.hi,c.soft);
      return item(c.id,c.label,c.pts,cr,"You placed "+usd(s)+" in "+GNAME[c.where]+". Target: "+rangeText(c.lo,c.hi)+".",WHY[c.why]); });
    cats.push({ id:"goal", name:"Goal Alignment", max:300, items:goal });
    // B. Emergency preparedness (250)
    var acc=0; ORDER.forEach(function(k){ acc += (alloc[k]||0)*A.access[k]; });
    var cov = Math.min(1, acc/prof.emergencyTarget);
    var em = [
      item("e1","Accessible emergency funds",100,cov,"Weighted accessible money: "+usd(acc)+" against a target of "+usd(prof.emergencyTarget)+". Insured cash counts in full, Treasuries 85%, stablecoins 50%, stocks 25%, retirement accounts and DeFi 0%.","Accessible means you can turn it into spendable dollars quickly without a big loss."),
      item("e2","Handled the emergency without forced sales",100,sim.payments.emergency.clean,"The "+usd(sim.payments.emergency.amount)+" "+prof.emergency.label.toLowerCase()+" was covered "+pct(sim.payments.emergency.clean)+" cleanly"+(sim.payments.emergency.shortfall?" and "+usd(sim.payments.emergency.shortfall)+" went on a credit card":"")+".","Paying from insured cash avoids selling at a bad time, penalties and high-interest debt."),
      item("e3","Handled the planned expense cleanly",50,sim.payments.planned.clean,"The "+usd(sim.payments.planned.amount)+" "+prof.planned.label.toLowerCase()+" was covered "+pct(sim.payments.planned.clean)+" cleanly"+(sim.payments.planned.shortfall?" and "+usd(sim.payments.planned.shortfall)+" went on a credit card":"")+".","Known bills are the easiest to plan for. They belong in stable places.")
    ];
    cats.push({ id:"emergency", name:"Emergency Preparedness", max:250, items:em });
    // Plan-viability gate: the risk-limit items and the idle-cash item only pay out in proportion to how well the plan

  function confetti(n){
    if (reduced() || !document.body.animate) return;
    var layer = document.createElement("div"); layer.className = "coinfx"; layer.setAttribute("aria-hidden","true"); document.body.appendChild(layer);
    var W = window.innerWidth, H = window.innerHeight;
    for (var i=0;i<n;i++) (function(){
      var c = document.createElement("i"); c.textContent = "$"; layer.appendChild(c);

    var d = ""; for (var i=0;i<=upto;i++) d += (i?"L":"M")+X(i).toFixed(1)+" "+Y(pts[i].nw).toFixed(1);
    var grid = "";

  function fxFor(ev, prof){

    if (t==="market") return "<div class='fx-red'></div><svg class='fx-graph' viewBox='0 0 300 150'><polyline class='draw' points='8,24 50,36 84,30 130,70 176,88 220,122 292,136' fill='none' stroke='#ff6a7a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/><path class='drawfill' d='M8 24 L50 36 L84 30 L130 70 L176 88 L220 122 L292 136 L292 150 L8 150Z' fill='rgba(255,106,122,.18)'/></svg><div class='fx-banner bad'>Stocks −"+B.pct(A.marketDecline.drop)+"</div>"+FXTAG;
    if (t==="emergency") return "<div class='fx-amber'></div><div class='fx-notify'><div class='siren' aria-hidden='true'></div><div><b>URGENT EXPENSE</b><span>"+esc(prof.emergency.label)+" · −"+B.usd(prof.emergency.amount)+"</span></div></div>"+FXTAG;
    if (t==="rates") return "<div class='fx-gauges'><div class='gauge'><span>High-yield savings APY</span><div class='gbar'><i class='gfill' style='--from:"+(A.apy.hysa/0.06*100)+"%;--to:"+((A.apy.hysa+A.rateChange.hysa)/0.06*100)+"%'></i></div><b>"+B.pct(A.apy.hysa,1)+" → "+B.pct(A.apy.hysa+A.rateChange.hysa,1)+"</b></div><div class='gauge'><span>Credit union savings APY</span><div class='gbar'><i class='gfill' style='--from:"+(A.apy.credit/0.06*100)+"%;--to:"+((A.apy.credit+A.rateChange.credit)/0.06*100)+"%'></i></div><b>"+B.pct(A.apy.credit,1)+" → "+B.pct(A.apy.credit+A.rateChange.credit,1)+"</b></div></div>"+FXTAG;
    if (t==="planned") return "<div class='fx-bill'><div class='slip'><small>BILL</small><b>"+esc(prof.planned.label)+"</b><span>"+B.usd(prof.planned.amount)+"</span><em class='stamp'>PAID</em></div></div>"+FXTAG;
    if (t==="depeg") return "<div class='fx-peg'><div class='pegline'><span>$1.00 peg</span></div><div class='pegcoin'><b>$</b><small>$"+A.depeg.price.toFixed(2)+"</small></div></div><div class='fx-beacon' aria-hidden='true'></div><div class='fx-banner warn'>Peg warning</div>"+FXTAG;
    if (t==="defi") return "<div class='fx-glitch'></div><div class='fx-banner glitch'>Protocol alert · withdrawals frozen</div>"+FXTAG;
    if (t==="inflation") { var pp = 1/(1+A.inflation.y1); return "<div class='fx-power'><span>Purchasing power</span><div class='gbar'><i class='gfill' style='--from:100%;--to:"+(pp*100).toFixed(1)+"%'></i></div><b>$100 now buys about $"+(pp*100).toFixed(1)+" of last year's goods</b></div>"+FXTAG; }
    if (t==="growth") return "<div class='fx-green'></div><div class='fx-arrows' aria-hidden='true'><i></i><i></i><i></i><i></i><i></i></div><div class='fx-banner good'>Market recovery +"+B.pct(A.growth.gain)+"</div>"+FXTAG;
    return "";
  }
  var EVCLASS = { market:"e-market", emergency:"e-emergency", rates:"e-rates", planned:"e-planned", depeg:"e-depeg", defi:"e-defi", inflation:"e-inflation", growth:"e-growth" };

  var actions = {
    home:function(){ go("home"); },
    tower:function(){ if (!window.FLQ_TOWER) return; FLQ_TOWER.enter(); S.back = "home"; go("tower"); },
    academy:function(){ go("academy"); },
    intro:function(){ go("intro"); },
    practice:function(){ S.ctx="practice"; startRun(); },
    ctx:function(el){ S.ctx = el.dataset.v; render(false); },
    start:function(){ startRun(); },
    open:function(el){ S.back = S.screen; S.dest = el.dataset.id; saved.lessons[S.dest]=true; persist(); go("dest"); },
    back:function(){ S.screen = S.back==="dest"?"home":S.back; render(); window.scrollTo(0,0); },
    pick:function(el){ if (S.answered) return; S.sel = el.dataset.id; render(false); },
    confirm:function(){ if (!S.sel||S.answered) return; var scn0=F.SCENARIOS[S.order[S.idx]], ok0=scn0.fits.indexOf(S.sel)>=0; sfx("confirm"); setTimeout(function(){ sfx(ok0?"correct":"learn"); if (ok0) confetti(26); }, 520); S.picks[S.idx]=S.sel; S.answered=true; render(false); var ex=document.getElementById("focus"); if (ex) ex.scrollIntoView({block:"start",behavior:"smooth"}); },
    next:function(){ if (S.idx===S.order.length-1) { finish(); return; } S.idx++; S.sel=null; S.answered=false; go("play"); },
    reset:function(){ saved={ best:0, claimed:{}, coins:0, xp:0, lessons:{}, runs:0, bBest:{} }; persist(); S.b = { pid:null, alloc:{}, reviewed:{}, reasons:{}, open:{}, sim:null, answers:{}, result:null, prev:null }; go("home"); }
  };

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]"); if (!el || el.disabled) return;
    var act = el.dataset.action; if (["brun","confirm","bans"].indexOf(act)<0) sfx("tap");
    var a = actions[act] || actionsB[act] || (window.FLQ_TOWER && FLQ_TOWER.actions[act]); if (a) a(el);
  });
  app.addEventListener("keydown", function(e){
    var el = e.target.closest("[data-action]");
    if (el && el.tagName!=="BUTTON" && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); el.dispatchEvent(new MouseEvent("click", { bubbles:true, cancelable:true })); }
  });
  document.addEventListener("keydown", function(e){
    if (S.screen==="tower" && window.FLQ_TOWER) { if (FLQ_TOWER.onKey(e)) e.preventDefault(); return; }
    if (S.screen!=="play" || e.metaKey||e.ctrlKey||e.altKey) return;
    var scn = F.SCENARIOS[S.order[S.idx]];
    if (!S.answered && /^[1-4]$/.test(e.key)) { var o = scn._opts[+e.key-1]; if (o) { S.sel=o.dest; render(false); } }
    else if (e.key==="Enter" && document.activeElement===document.body) { if (!S.answered) actions.confirm(); else actions.next(); }
  });


  /* ---- audio wiring (iPhone Safari: the context is created and resumed only inside a user gesture) ---- */
  (function(){
    var A = window.FLQ_AUDIO, m = document.getElementById("amusic"), x = document.getElementById("asfx");
    function sync(){ if (!A) return; var s = A.state(); m.setAttribute("aria-pressed", String(s.music)); m.setAttribute("aria-label", s.music ? "Music on. Press to mute music." : "Music muted. Press to turn music on."); x.setAttribute("aria-pressed", String(s.sfx)); x.setAttribute("aria-label", s.sfx ? "Sound effects on. Press to mute effects." : "Sound effects muted. Press to turn effects on."); }
    if (!A) return; A.onChange(sync); sync();
    m.addEventListener("click", function(){ A.toggleMusic(); });
    x.addEventListener("click", function(){ A.toggleSfx(); });
    function first(){ A.unlock(); ["pointerdown","touchend","keydown"].forEach(function(t){ document.removeEventListener(t, first, true); }); }
    ["pointerdown","touchend","keydown"].forEach(function(t){ document.addEventListener(t, first, true); });
  })();

  if (window.FLQ_TOWER) { var tstore = null; try { tstore = window.localStorage; } catch (e) {} FLQ_TOWER.mount({ storage:tstore, esc:esc, sfx:sfx, rerender:function(f){ render(f); } }); }
  render(false);
  // Deep link from the Bonus Games hub: financial-city.html?open=tower opens the DeFi Tower intro directly.
  try { if (window.FLQ_TOWER && new URLSearchParams(window.location.search).get("open") === "tower") { actions.tower(); } } catch (e) {}
})();
</script>
